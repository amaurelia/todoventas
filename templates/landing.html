<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoVentas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/landing.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TodoVentas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-controls="menuNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#mapa">Mapa</a></li>
                    <li class="nav-item"><a class="nav-link" href="#footer">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="inicio" class="py-5 bg-warning-subtle">
        <div class="container text-center py-4">
            <h1 class="display-5 fw-bold">Bienvenido a TodoVentas</h1>
            <p class="lead mt-3 mb-0">Esta es la sección principal del body con un color distinto.</p>
        </div>
    </section>

    <section id="mapa" class="py-5 bg-info-subtle">
        <div class="container">
            <h2 class="text-center mb-4">Ubicación en el mapa</h2>
            <div class="ratio ratio-16x9 border rounded-3 overflow-hidden">
                <iframe
                    src="https://www.openstreetmap.org/export/embed.html?bbox=-74.15%2C4.55%2C-74.03%2C4.75&layer=mapnik"
                    style="border:0"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Mapa de ubicación">
                </iframe>
            </div>
        </div>
    </section>

    <footer id="footer" class="py-4 bg-dark text-white text-center">
        <div class="container">
            <p class="mb-0">TodoVentas - Footer con color distinto</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
